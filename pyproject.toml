[project]
name = "yovahti"
version = "0.1.0"
description = "Energy-saving radio network agents that must earn the right to act: risk-aware cell sleep planning, MCP, behavioural tests and attested admission."
authors = [
    { name = "FrankPonce", email = "108038901+FrankPonce@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mcp>=2.3,<3",
    "numpy>=2.5.5",
    "ortools>=9.15.6755",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "rfc8785>=0.1.4",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "z3-solver>=5.4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: needs internet access (skipped in CI by default)"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Runs inside Blender's own Python (bpy), not this project's environment
extend-exclude = ["tools/render_scenes.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
